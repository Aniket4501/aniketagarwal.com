# The gates that were only ever run by hand. A portfolio built around rigour
# should not depend on somebody remembering to run the truth check.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Static gates. These need no server.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:truth
      - run: npm run check:content
      - run: npm run build
      - run: npm run check:budget

      # Live gates. axe and the external link check both need the built site
      # actually serving.
      - run: npx playwright install --with-deps chromium
      - name: Serve and check
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000
          npm run check:a11y
          npm run check:links
